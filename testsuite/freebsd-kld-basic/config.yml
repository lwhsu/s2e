test:
    description: "FreeBSD kernel module: symbolic port I/O, symbolic MMIO and fault injection"

    targets:
        - freebsd64-kld-basic.ko

    # The module is built against S2E_FREEBSD_SYSDIR (the 15.1 tree). It loads on 15.x kernels
    # (stable/15 keeps the KBI), not on 16.0-CURRENT ("version mismatch").
    target-images:
        - freebsd-15.1-x86_64
        - freebsd-15.1-x86_64-s2ekernel
        - freebsd-stable15-x86_64

    build-options:
        post-project-generation-script: fix-config.sh
