test:
    description: "FreeBSD main: kernel module with symbolic port I/O, symbolic MMIO and fault injection"

    targets:
        - freebsd64-kld-basic.ko

    # Built against S2E_FREEBSD_SYSDIR_MAIN; only loads on the matching kernel.
    target-images:
        - freebsd-main-x86_64

    build-options:
        post-project-generation-script: fix-config.sh
